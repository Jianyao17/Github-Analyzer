<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <meta name="supported-color-schemes" content="light dark" />
  <title>{{AppName}}</title>
  <style>
    /* CSS Variables Setup (Nuxt UI Theme) */
    :root {
      /* Brand (Nuxt Emerald) */
      --color-primary: #10b981;
      --color-primary-hover: #059669;
      --color-primary-text: #ffffff;

      /* Light Theme (Nuxt Neutral) */
      --color-bg: #f5f5f5;
      --color-surface: #ffffff;
      --color-border: #e5e5e5;
      --color-text: #171717;
      --color-text-muted: #525252;
      --color-text-subtle: #737373;
      --color-code-bg: #f5f5f5;

      /* Dark Theme (Nuxt Neutral) */
      --color-bg-dark: #0a0a0a;
      --color-surface-dark: #171717;
      --color-border-dark: #262626;
      --color-text-dark: #fafafa;
      --color-text-muted-dark: #a3a3a3;
      --color-text-subtle-dark: #737373;
      --color-code-bg-dark: #262626;

      /* Warning Theme (Nuxt Amber) */
      --color-warning-bg: #fffbeb;
      --color-warning-border: #fde68a;
      --color-warning-text: #b45309;

      --color-warning-bg-dark: #451a03;
      --color-warning-border-dark: #78350f;
      --color-warning-text-dark: #fde68a;

      /* Typography */
      --font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --font-size-sm: 13px;
      --font-size-base: 15px;
      --font-size-lg: 18px;
      --font-size-xl: 24px;

      /* Spacing & Radius */
      --radius-card: 12px;
      --radius-btn: 8px;
      --spacing-section: 32px;
    }

    /* Dark mode explicit usage */
    @media (prefers-color-scheme: dark) {
      body, .email-wrapper { background-color: var(--color-bg-dark) !important; }
      .email-card { background-color: var(--color-surface-dark) !important; border-color: var(--color-border-dark) !important; }
      .email-header { border-bottom-color: var(--color-border-dark) !important; }
      body, .email-header .brand, .email-body h1, .email-body .greeting { color: var(--color-text-dark) !important; }
      .email-body .subtitle, .email-body .message, .fallback-details .fallback-content { color: var(--color-text-muted-dark) !important; }
      .email-footer p, .fallback-details summary { color: var(--color-text-subtle-dark) !important; }
      .fallback-details .fallback-content { background-color: var(--color-code-bg-dark) !important; }
      .alert-warning { background-color: var(--color-warning-bg-dark) !important; border-color: var(--color-warning-border-dark) !important; color: var(--color-warning-text-dark) !important; }
      .divider { border-top-color: var(--color-border-dark) !important; }
    }

    /* Reset */
    body, table, td, p, a, li, blockquote {
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100% !important;
      min-width: 100%;
      background-color: var(--color-bg);
      font-family: var(--font-family);
      color: var(--color-text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    img {
      border: 0;
      height: auto;
      outline: none;
      text-decoration: none;
      max-width: 100%;
    }

    a {
      color: var(--color-primary);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    /* Layout */
    .email-wrapper {
      width: 100%;
      background-color: var(--color-bg);
      padding: 40px 16px;
    }

    .email-container {
      max-width: 600px;
      margin: 0 auto;
    }

    /* Card */
    .email-card {
      width: 100%;
      max-width: 600px;
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-card);
      overflow: hidden;
    }

    /* Header */
    .email-header {
      padding: 24px var(--spacing-section);
      text-align: center;
      border-bottom: 1px solid var(--color-border);
    }

    .email-header .brand {
      font-size: var(--font-size-lg);
      font-weight: 700;
      color: var(--color-text);
      letter-spacing: -0.02em;
    }

    /* Body */
    .email-body {
      padding: var(--spacing-section);
    }

    .email-body h1 {
      margin: 0 0 8px 0;
      font-size: var(--font-size-xl);
      font-weight: 700;
      color: var(--color-text);
      letter-spacing: -0.025em;
      line-height: 1.3;
    }

    .email-body .subtitle {
      margin: 0 0 24px 0;
      font-size: var(--font-size-base);
      color: var(--color-text-muted);
    }

    .email-body .greeting {
      margin: 0 0 16px 0;
      font-size: var(--font-size-base);
      color: var(--color-text);
      font-weight: 600;
    }

    .email-body .message {
      margin: 0 0 24px 0;
      font-size: var(--font-size-base);
      color: var(--color-text-muted);
      line-height: 1.6;
    }

    /* CTA Button */
    .cta-wrapper {
      text-align: center;
      margin: 32px 0;
    }

    .cta-button {
      display: inline-block;
      padding: 12px 32px;
      background-color: var(--color-primary);
      color: var(--color-primary-text) !important;
      font-size: var(--font-size-base);
      font-weight: 600;
      text-decoration: none !important;
      border-radius: var(--radius-btn);
      letter-spacing: -0.01em;
      transition: background-color 0.15s ease;
    }

    .cta-button:hover {
      background-color: var(--color-primary-hover);
    }

    /* Fallback Details */
    .fallback-details {
      margin: 24px 0 0 0;
    }

    .fallback-details summary {
      font-size: var(--font-size-sm);
      color: var(--color-text-subtle);
      cursor: pointer;
    }

    .fallback-details .fallback-content {
      margin-top: 10px;
      padding: 14px 16px;
      background-color: var(--color-code-bg);
      border-radius: var(--radius-btn);
      font-size: var(--font-size-sm);
      color: var(--color-text-muted);
      word-break: break-all;
    }

    .fallback-details .fallback-content a {
      color: var(--color-primary);
      word-break: break-all;
    }

    /* Alert Warning */
    .alert-warning {
      background-color: var(--color-warning-bg);
      border: 1px solid var(--color-warning-border);
      color: var(--color-warning-text);
      padding: 12px 16px;
      border-radius: var(--radius-btn);
      font-size: var(--font-size-sm);
      margin: 24px 0;
      line-height: 1.5;
    }

    /* Divider */
    .divider {
      border: none;
      border-top: 1px solid var(--color-border);
      margin: 28px 0;
    }

    /* Footer */
    .email-footer {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px 16px;
      text-align: center;
    }

    .email-footer p {
      margin: 0 0 4px 0;
      font-size: var(--font-size-sm);
      color: var(--color-text-subtle);
      line-height: 1.6;
    }

    /* Responsive */
    @media only screen and (max-width: 640px) 
    {
      .email-wrapper { padding: 24px 12px; }
      .email-body { padding: 24px 20px; }
      .email-header { padding: 20px; }
      .email-body h1 { font-size: 20px; }
      .cta-button { 
        padding: 12px 24px; 
        font-size: 14px; 
        width: 100%; 
        box-sizing: border-box; 
      }
    }
  </style>

  </style>
  <![endif]-->
</head>
<body style="background-color: var(--color-bg); margin: 0; padding: 0;">
  <div class="email-wrapper">
    <!--[if mso | IE]>
    <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" bgcolor="var(--color-bg)">
      <tr>
        <td align="center" valign="top" style="padding: 40px 16px;">
          <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="600">
            <tr>
              <td align="left" valign="top">
    <![endif]-->
    <div class="email-container">
      <!-- Card -->
      <div class="email-card">
        <!-- Header -->
        <div class="email-header">
          <span class="brand">
            {{AppName}}
          </span>
        </div>
        <!-- Body -->
        <div class="email-body">
          {{RenderBody}}
        </div>
      </div>
      <!-- /Card -->
      <!-- Footer -->
      <div class="email-footer">
        <p>&copy; {{Year}} {{AppName}}. All rights reserved.</p>
        <p>This is an automated message - please do not reply directly.</p>
      </div>
    </div>
    <!--[if mso | IE]>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
    <![endif]-->
  </div>
</body>
</html>
