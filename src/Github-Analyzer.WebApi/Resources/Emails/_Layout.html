<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <meta name="supported-color-schemes" content="light dark" />
  <title>{{AppName}}</title>
  <style>
    /* ── CSS Variables ──────────────────────────────────────────────── */
    :root {
      /* Brand */
      --color-primary: #00DC82;
      --color-primary-hover: #00C974;
      --color-primary-text: #021a0d;

      /* Light mode (default) */
      --color-bg: #FFFFFF;
      --color-surface: #FFFFFF;
      --color-border: #E5E7EB;
      --color-text: #18181B;
      --color-text-muted: #71717A;
      --color-text-subtle: #A1A1AA;
      --color-footer-bg: #F9FAFB;
      --color-code-bg: #F4F4F5;

      /* Typography */
      --font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --font-size-sm: 13px;
      --font-size-base: 15px;
      --font-size-lg: 17px;
      --font-size-xl: 24px;

      /* Spacing & Radius */
      --radius-card: 12px;
      --radius-btn: 8px;
      --spacing-section: 32px;
    }

    /* ── Dark mode overrides ────────────────────────────────────────── */
    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg: #0B0F19;
        --color-surface: #1B1F2E;
        --color-border: #2E3344;
        --color-text: #F4F4F5;
        --color-text-muted: #A1A1AA;
        --color-text-subtle: #71717A;
        --color-footer-bg: #151928;
        --color-code-bg: #252A3A;
      }
    }

    /* ── Reset ──────────────────────────────────────────────────────── */
    body,
    table,
    td,
    p,
    a,
    li,
    blockquote {
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100% !important;
      min-width: 100%;
      background-color: var(--color-bg);
      font-family: var(--font-family);
      color: var(--color-text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    img {
      border: 0;
      height: auto;
      outline: none;
      text-decoration: none;
    }

    a {
      color: var(--color-primary);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    /* ── Layout ─────────────────────────────────────────────────────── */
    .email-wrapper {
      width: 100%;
      background-color: var(--color-bg);
      padding: 40px 16px 0;
    }

    .email-container {
      max-width: 600px;
      margin: 0 auto;
    }

    /* ── Card (structural wrapper only) ──────────────────────────────────── */
    .email-card {
      max-width: 600px;
    }

    /* ── Header ─────────────────────────────────────────────────────── */
    .email-header {
      padding: 28px var(--spacing-section);
      text-align: center;
    }

    .email-header .brand {
      font-size: var(--font-size-lg);
      font-weight: 700;
      color: var(--color-text);
      letter-spacing: -0.02em;
    }

    .email-header .brand-accent {
      color: var(--color-primary);
    }

    /* ── Body ───────────────────────────────────────────────────────── */
    .email-body {
      padding: var(--spacing-section);
    }

    .email-body h1 {
      margin: 0 0 8px 0;
      font-size: var(--font-size-xl);
      font-weight: 700;
      color: var(--color-text);
      letter-spacing: -0.025em;
      line-height: 1.3;
    }

    .email-body .subtitle {
      margin: 0 0 24px 0;
      font-size: var(--font-size-base);
      color: var(--color-text-muted);
    }

    .email-body .greeting {
      margin: 0 0 16px 0;
      font-size: var(--font-size-base);
      color: var(--color-text);
    }

    .email-body .message {
      margin: 0 0 28px 0;
      font-size: var(--font-size-base);
      color: var(--color-text-muted);
      line-height: 1.7;
    }

    /* ── CTA Button ─────────────────────────────────────────────────── */
    .cta-wrapper {
      text-align: center;
      margin: 28px 0;
    }

    .cta-button {
      display: inline-block;
      padding: 12px 32px;
      background-color: var(--color-primary);
      color: var(--color-primary-text) !important;
      font-size: var(--font-size-base);
      font-weight: 600;
      text-decoration: none !important;
      border-radius: var(--radius-btn);
      letter-spacing: -0.01em;
      transition: background-color 0.15s ease;
    }

    .cta-button:hover {
      background-color: var(--color-primary-hover);
      text-decoration: none !important;
    }

    /* ── Fallback URL (collapsible) ─────────────────────────────────── */
    .fallback-details {
      margin: 24px 0 0 0;
    }

    .fallback-details summary {
      font-size: var(--font-size-sm);
      color: var(--color-text-subtle);
      cursor: pointer;
      list-style: none;
      user-select: none;
    }

    .fallback-details summary::-webkit-details-marker {
      display: none;
    }

    .fallback-details summary::before {
      content: '▸ ';
    }

    .fallback-details[open] summary::before {
      content: '▾ ';
    }

    .fallback-details .fallback-content {
      margin-top: 10px;
      padding: 14px 16px;
      background-color: var(--color-code-bg);
      border-radius: 8px;
      font-size: var(--font-size-sm);
      color: var(--color-text-muted);
      word-break: break-all;
      line-height: 1.5;
    }

    .fallback-details .fallback-content a {
      color: var(--color-primary);
      word-break: break-all;
    }

    /* ── Divider ────────────────────────────────────────────────────── */
    .divider {
      border: none;
      border-top: 1px solid var(--color-border);
      margin: 28px 0;
    }

    /* ── Footer (full-width background, centered content) ─────────── */
    .email-footer-wrapper {
      width: 100%;
      background-color: var(--color-footer-bg);
    }

    .email-footer {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px var(--spacing-section);
      text-align: center;
    }

    .email-footer p {
      margin: 0 0 4px 0;
      font-size: var(--font-size-sm);
      color: var(--color-text-subtle);
      line-height: 1.6;
    }

    /* ── Responsive ─────────────────────────────────────────────────── */
    @media only screen and (max-width: 640px) {
      .email-wrapper {
        padding: 24px 12px 0;
      }

      .email-body {
        padding: 24px 20px;
      }

      .email-header {
        padding: 20px 20px;
      }

      .email-footer {
        padding: 20px;
      }

      .email-body h1 {
        font-size: 20px;
      }

      .cta-button {
        padding: 12px 24px;
        font-size: 14px;
      }
    }
  </style>
  <!--[if mso]>
  <style type="text/css">
    body, table, td { font-family: 'Segoe UI', Arial, sans-serif !important; }
    .cta-button { background-color: #00DC82 !important; padding: 12px 32px !important; }
  </style>
  <![endif]-->
</head>

<body>
  <div class="email-wrapper">
    <div class="email-container">

      <!-- Card -->
      <div class="email-card">

        <!-- Header -->
        <div class="email-header">
          <span class="brand">
            {{AppName}}
          </span>
        </div>

        <!-- Body -->
        <div class="email-body">
          {{RenderBody}}
        </div>

      </div>
      <!-- /Card -->

    </div>
  </div>

  <!-- Footer (full-width background) -->
  <div class="email-footer-wrapper">
    <div class="email-footer">
      <p>&copy; {{Year}} {{AppName}}. All rights reserved.</p>
      <p>This is an automated message — please do not reply directly.</p>
    </div>
  </div>
</body>

</html>
